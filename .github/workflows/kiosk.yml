name: kiosk

# Builds the kiosk module, tournament.bin, so a change that breaks kiosk/
# fails the PR, and keeps the module as the `tournament-bin` artifact.
# release.yml calls this workflow on every push to main and every v* tag to
# put the module in the bundle. No Nintendo file is needed: build_module.py
# takes the stock 1.02 facts it checks (DOL sections, guard word) from the
# decomp (docs/kiosk.md).
#
# The decomp's compilers, binutils and sjiswrap come from
# kiosk/tools/fetch_decomp_tools.py, the same script developers run.

on:
  workflow_call:   # release.yml
  workflow_dispatch:
  pull_request:
    paths:
      - "kiosk/**"
      - "protocol.yaml"
      - "generated/**"
      - "melee"
      - "Nintendont"
      - ".github/workflows/kiosk.yml"

jobs:
  module:
    runs-on: windows-latest   # the decomp's compilers are .exe files
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # melee (headers, symbols.txt, compilers) and Nintendont (gecko codesets)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ninja
      - name: melee submodule commit
        id: melee
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:melee)" >> "$GITHUB_OUTPUT"
      - name: Cache the decomp's tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            melee/build/compilers
            melee/build/binutils
            melee/build/tools
          key: kiosk-melee-tools-v2-${{ runner.os }}-${{ steps.melee.outputs.sha }}
      - name: Fetch the compilers, binutils and sjiswrap (kept from the cache when present)
        run: python kiosk/tools/fetch_decomp_tools.py
      - name: Build the module
        run: python kiosk/tools/build_module.py
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-bin
          path: kiosk/build/tournament.bin
          if-no-files-found: error
