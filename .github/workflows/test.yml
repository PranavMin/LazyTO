name: test

# Pull requests run it directly; release.yml calls it on every push to main
# before anything is published.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 22 as the Pi runs it; Node 24 as Electron 44 embeds it in the desktop app.
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      # npm test checks the protocol header copy in Nintendont/kernel/; melee is not needed.
      - run: git submodule update --init --depth 1 Nintendont
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: npm ci
      - run: npm run format:check
      # The Pi's installer and updater (shellcheck ships on GitHub's Ubuntu images).
      - run: shellcheck deploy/*.sh
      - run: npm test
      - run: npm run build
