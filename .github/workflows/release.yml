name: release

# A tag v* creates a DRAFT release with the two bundles below and
# tournament.bin, built by kiosk.yml on Windows from the same commit. Attach
# the loader's apps/LazyTO folder by hand (it comes from the Nintendo repo's
# CI), then publish the draft. Run by hand (workflow_dispatch) it only
# uploads the bundles as artifacts.
#
# Every push to main also runs the tests and republishes the relay bundle as
# lazyto-relay-main.tgz (+ VERSION, .sha256) on the moving prerelease tag
# `latest`. The Pi's deploy/update.sh fetches it at every relay start, so a
# push to main reaches a venue Pi at its next boot or service restart with no
# npm run push. Only the relay: the Wii side still ships by hand. Dev clones see
# the tag move on fetch; that is expected.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  bundles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # npm test checks the protocol header copy in Nintendont/kernel/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "ver=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "ver=main" >> "$GITHUB_OUTPUT";
          else echo "ver=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - name: Relay bundle (what npm run push sends to the Pi, minus config.json)
        run: |
          mkdir -p out/relay
          cp -r dist deploy package.json package-lock.json README.md LICENSE out/relay/
          # VERSION: what deploy/update.sh compares; one token, the commit it was built from.
          echo "$(git rev-parse --short HEAD)" > out/relay/VERSION
          cp out/relay/VERSION out/VERSION
          tar -czf "out/lazyto-relay-${{ steps.v.outputs.ver }}.tgz" -C out/relay .
          (cd out && sha256sum "lazyto-relay-${{ steps.v.outputs.ver }}.tgz" > "lazyto-relay-${{ steps.v.outputs.ver }}.tgz.sha256")
      - name: Wii kit (everything for the SD cards except the two built files)
        run: |
          mkdir -p out/wii
          cp deploy/tournament.cfg.example docs/kiosk-poster.html docs/wii-setup.md docs/night-of.md LICENSE out/wii/
          cat > out/wii/README.txt <<'EOF'
          LazyTO Wii kit. Each SD card needs:
            apps/LazyTO/        the loader (attached to the release as a zip)
            tournament.bin      the kiosk module (attached to the release)
            tournament.cfg      from tournament.cfg.example: station number, stream=1 on the stream Wii only, the relay's secret
            games/GALE01/game.iso   your own stock Melee 1.02 image
          See wii-setup.md. `npm run sync-card` does all of it from a clone of the repo (Windows, macOS, Linux).
          EOF
          (cd out/wii && zip -qr "../lazyto-wii-kit-${{ steps.v.outputs.ver }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ steps.v.outputs.ver }}
          path: |
            out/*.tgz
            out/*.zip
      - name: Publish main to the `latest` prerelease (deploy/update.sh reads it)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate so the tag follows main; a Pi that checks during the gap
          # gets no VERSION and keeps what it has (update.sh treats that as offline).
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --prerelease --target "$GITHUB_SHA" \
            --title "latest (main $(git rev-parse --short HEAD))" \
            --notes "Moving prerelease: the relay bundle built from the newest main for Pi auto-update (deploy/update.sh). Not a release; see the v* releases." \
            out/lazyto-relay-main.tgz out/lazyto-relay-main.tgz.sha256 out/VERSION

  module:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/kiosk.yml

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [bundles, module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles-${{ github.ref_name }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: tournament-bin
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --draft --title "LazyTO ${{ github.ref_name }}" \
            --notes "Draft. Before publishing, attach apps-LazyTO.zip (the loader from the Nintendont repo's CI build for the matching commit), then edit these notes. tournament.bin is built by CI from this tag." \
            out/*.tgz out/*.zip out/tournament.bin
