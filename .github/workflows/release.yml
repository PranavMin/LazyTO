name: release

# Builds LazyTO's one bundle, lazyto.tgz, from one commit: the relay (dist/,
# deploy/, package.json) and the Wii files (wii/apps/LazyTO/, the loader
# built from the pinned Nintendont commit, and wii/tournament.bin, the kiosk
# module from kiosk.yml). Its assets keep the same names everywhere:
# lazyto.tgz, lazyto.tgz.sha256, VERSION and install.sh.
#
# - Every push to main republishes the moving prerelease main-build, which
#   Pis on the main update channel follow (deploy/update.sh).
# - A v* tag makes a DRAFT release with the same assets. Publish it as a full
#   release (not a pre-release): Pis on the default release channel, and the
#   install line in the README, follow the newest full release.
# - Run by hand, it builds the bundle as an artifact and publishes nothing.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# A newer push to main replaces an older one still building; tags never cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  module:
    uses: ./.github/workflows/kiosk.yml

  loader:
    runs-on: ubuntu-latest
    env:
      # The build image the Nintendont fork's own CI uses (its build.yml),
      # pinned to tag 7, which :latest pointed at on 2025-09-14.
      IMAGE: nikhilnarayana/devkitpro-slippi:7@sha256:098e03383069609f68cbb950368ac3de18b855b473b7474a0ac9cf830ef43c78
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 Nintendont
      - name: Pinned Nintendont commit
        id: nin
        run: echo "sha=$(git rev-parse --short=7 HEAD:Nintendont)" >> "$GITHUB_OUTPUT"
      # One build per pinned commit (and per edit of this file).
      - name: Loader already built
        id: cache
        uses: actions/cache@v4
        with:
          path: out/apps
          key: loader-${{ steps.nin.outputs.sha }}-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD/Nintendont:/work" -w /work "$IMAGE" \
            make -j"$(nproc)" GIT_VERSION=LazyTO-${{ steps.nin.outputs.sha }}
      - name: Package apps/LazyTO as the fork's CI does
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          d=out/apps/LazyTO
          mkdir -p "$d"
          cp Nintendont/loader/loader.dol "$d/boot.dol"
          cp Nintendont/nintendont/icon.png Nintendont/nintendont/meta.xml "$d/"
          ver=$(grep NIN_VERSION Nintendont/common/include/NintendontVersion.h | cut -d ' ' -f 3 | cut -d '"' -f 2)
          sed -i -e "s|<version>|<version>$ver|" \
            -e "s|<release_date>|<release_date>$(date +%Y%m%d000000)|" \
            -e "s|<git_hash>|<git_hash>${{ steps.nin.outputs.sha }}|" "$d/meta.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: loader
          path: out/apps
          if-no-files-found: error

  bundle:
    needs: [test, module, loader]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: tournament-bin
          path: out/bundle/wii
      - uses: actions/download-artifact@v4
        with:
          name: loader
          path: out/bundle/wii/apps
      - name: lazyto.tgz
        run: |
          # VERSION: what deploy/update.sh compares, and the status page shows.
          case "$GITHUB_REF" in
            refs/tags/v*) version=${GITHUB_REF#refs/tags/} ;;
            refs/heads/main) version=main-$(git rev-parse --short=7 HEAD) ;;
            *) version=dev-$(git rev-parse --short=7 HEAD) ;;
          esac
          cp -r dist deploy package.json README.md LICENSE out/bundle/
          echo "$version" > out/bundle/VERSION
          tar -czf out/lazyto.tgz -C out/bundle .
          (cd out && sha256sum lazyto.tgz > lazyto.tgz.sha256)
          cp out/bundle/VERSION deploy/install.sh out/
          tar -tzvf out/lazyto.tgz | grep -v '/$' | awk '{print $3, $6}'
      - uses: actions/upload-artifact@v4
        with:
          name: lazyto
          path: |
            out/lazyto.tgz
            out/lazyto.tgz.sha256
            out/VERSION
            out/install.sh
          if-no-files-found: error

  publish-main:
    if: github.ref == 'refs/heads/main'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lazyto
          path: out
      - name: Republish main-build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Recreated so its tag follows main. A Pi that checks in the gap finds
          # no VERSION and keeps what it has. VERSION goes up last, so a Pi that
          # sees it can download the rest.
          gh release delete main-build --yes --cleanup-tag 2>/dev/null || true
          gh release create main-build --prerelease --target "$GITHUB_SHA" \
            --title "main-build ($(cat out/VERSION))" \
            --notes "The newest build of main, for Pis on the main update channel and for testing: curl -fsSL https://github.com/$GH_REPO/releases/download/main-build/install.sh | sudo bash -s -- --channel main. Not a release." \
            out/lazyto.tgz out/lazyto.tgz.sha256 out/install.sh
          gh release upload main-build out/VERSION

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lazyto
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "LazyTO $GITHUB_REF_NAME" \
            --notes "Draft: write the notes, then publish it as a full release, not a pre-release. Pis on the release channel follow the newest full release." \
            out/lazyto.tgz out/lazyto.tgz.sha256 out/VERSION out/install.sh
