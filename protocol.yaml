# protocol.yaml — single source of truth for the Wii <-> relay wire protocol.
#
# This file is design.md section 5 in machine-readable form. Everything on the
# wire is defined here and nowhere else. Generated outputs (do not edit them):
#
#   generated/relay_proto.h   C header for the Melee decomp + Nintendont kernel
#   generated/wire.ts         encode/decode module for the relay
#
# Regenerate:  python tools/gen_protocol.py
# Verify:      python tools/check_protocol.py   (CI fails on drift)
#
# Layout rules enforced by the generator:
#   - All integers big-endian on the wire (PowerPC sends structs as-is).
#   - All strings ASCII, NUL-padded, not NUL-terminated if full.
#   - Every field must fall on its natural alignment with no implicit
#     padding; padding is always an explicit _pad field.
#   - Each struct declares its expected size; the generator errors if the
#     computed layout disagrees.

protocol:
  version: 1
  magic: "MT"          # first two bytes of every message
  endian: big

constants:
  MAX_GAMES:
    value: 5
    doc: "games per set (best of 5)"
  MAX_SETS:
    value: 56
    doc: "cap on set_entry rows in a LIST_SETS response; 56 is the most that fits the game's 4 KB poll buffer (4096 - 12 exi_poll_hdr - 8 hdr - 32 resp - 4 fixed = 4040 bytes = 56 rows of 72)"
  MSG_LEN:
    value: 30
    doc: "human-readable status text in relay_resp"
  ROUND_LEN:
    value: 24
    doc: "round name as the players see it, upper case: \"WINNERS QUARTER-FINAL\", \"LOSERS ROUND 1\", \"GRAND FINAL RESET\" (start.gg fullRoundText, cut to fit)"
  TAG_LEN:
    value: 16
    doc: "player tag"
  BEACON_PORT:
    value: 7778
    doc: "UDP port the relay broadcasts relay_beacon to and every station listens on (design R15: stations find the relay; tournament.cfg has no relay address)"
  BEACON_INTERVAL_MS:
    value: 2000
    doc: "the relay sends one relay_beacon per interval on every IPv4 interface"
  SECRET_LEN:
    value: 16
    doc: "relay shared secret, printable ASCII, NUL-padded (design R16)"
  AUTH_MAGIC_0:
    value: 0x4D
    doc: "'M', first byte of relay_auth"
  AUTH_MAGIC_1:
    value: 0x4B
    doc: "'K', second byte of relay_auth; differs from relay_hdr's 'T' so a host that sends no relay_auth is told so"

enums:
  relay_cmd:
    doc: "request/response command, echoed back in the response header"
    values:
      CMD_LIST_SETS:    {value: 1}
      CMD_START_SET:    {value: 2}
      CMD_REPORT_SCORE: {value: 3}
      CMD_END_SET:      {value: 4}
      CMD_ABANDON_SET:  {value: 5, doc: "player-initiated \"wrong set\"; relay resets it"}

  relay_status:
    doc: "result of a request, first byte of relay_resp"
    values:
      ST_OK:            {value: 0}
      ST_BAD_VERSION:   {value: 1}
      ST_SET_NOT_FOUND: {value: 2}
      ST_SET_TAKEN:     {value: 3, doc: "started on another station"}
      ST_NOT_STREAM:    {value: 4, doc: "stream flag from non-stream station"}
      ST_STARTGG_ERROR: {value: 5, doc: "upstream rejected; see status page"}
      ST_RATE_LIMITED:  {value: 6}
      ST_INTERNAL:      {value: 7}
      ST_BAD_SECRET:    {value: 8, doc: "relay_auth missing or its secret wrong; check secret= on the SD card (design R16)"}

  exi_cmd:
    doc: >-
      Command byte on the fake relay EXI device. Shared by the game side
      (lbrelayexi.c), Slippi Dolphin's forwarder, and Nintendont's RelayEXI;
      not part of the TCP wire format. Values chosen clear of Slippi's
      EXI command space, which extends to 0xE5 (CMD_GET_RANK_VISIBILITY
      in EXI_DeviceSlippi.h).
    values:
      EXI_RELAY_REQ:  {value: 0xF0, doc: "write request buffer to the ARM side"}
      EXI_RELAY_POLL: {value: 0xF1, doc: "read {state, response buffer}"}

  exi_poll_state:
    doc: "state byte of exi_poll_hdr, the first thing an EXI_RELAY_POLL read returns"
    values:
      RELAY_IDLE:  {value: 0}
      RELAY_BUSY:  {value: 1, doc: "request in flight on the ARM side"}
      RELAY_DONE:  {value: 2, doc: "response buffer valid"}
      RELAY_ERROR: {value: 3, doc: "transport failed; response buffer is zeroed"}

structs:
  exi_poll_hdr:
    doc: >-
      What an EXI_RELAY_POLL read starts with (the game's lbRelayExi_PollBuf:
      this, then relay_hdr, relay_resp and the payload). Not on the TCP wire:
      filled by the host of the fake EXI device (Nintendont kernel, Slippi
      Dolphin) on every poll, so the game can show which station it is and
      which relay it is talking to even while the relay never answers. The
      response bytes after it are valid only when state == RELAY_DONE.
    size: 12
    fields:
      - {name: state,      type: u8,  doc: "enum exi_poll_state"}
      - {name: _pad,       type: u8}
      - {name: station,    type: u16, doc: "tournament.cfg station; 0 in Dolphin (design R10)"}
      - {name: relay_ip,   type: u32, doc: "relay IPv4 address as a big-endian u32 (10.0.0.2 = 0x0A000002); 0 = unknown"}
      - {name: relay_port, type: u16, doc: "relay TCP port; 0 = unknown"}
      - {name: _pad2,      type: u16}

  relay_beacon:
    doc: >-
      Relay discovery (design R15). Not on the TCP wire: one UDP datagram,
      broadcast by the relay every BEACON_INTERVAL_MS to each IPv4
      interface's directed broadcast address, port BEACON_PORT. A station
      (Nintendont kernel, Slippi Dolphin forwarder) listens on BEACON_PORT,
      ignores datagrams whose size, magic or version do not match, and
      takes the datagram's SOURCE address plus tcp_port as the relay; the
      latest valid beacon wins, so a relay that changes address is followed.
      One relay per LAN.
    size: 12
    fields:
      - {name: magic,    type: u8, array: 2, doc: "'M','T'"}
      - {name: version,  type: u8,           doc: "PROTO_VERSION"}
      - {name: _pad,     type: u8}
      - {name: tcp_port, type: u16,          doc: "the relay's TCP port for relay_hdr requests"}
      - {name: _pad2,    type: u16}
      - {name: event_id, type: u32,          doc: "start.gg event the relay serves; for logs and display only"}

  relay_auth:
    doc: >-
      Relay shared secret (design R16). Not part of the game's messages: the
      host of the fake EXI device (Nintendont kernel, Slippi Dolphin
      forwarder) writes it on the TCP connection before the game's relay_hdr
      + payload, with the secret from its own config (tournament.cfg secret=,
      Dolphin SlippiRelaySecret). The relay compares the secret with its
      config in constant time and answers a missing or wrong one with
      ST_BAD_SECRET without acting on the request. Responses carry no
      relay_auth. Plaintext on the LAN: it keeps passers-by on a shared Wi-Fi
      out, not someone capturing the Wi-Fi traffic.
    size: 20
    fields:
      - {name: magic,  type: u8,   array: 2, doc: "AUTH_MAGIC_0, AUTH_MAGIC_1 ('M','K')"}
      - {name: _pad,   type: u16}
      - {name: secret, type: char, array: SECRET_LEN, doc: "the shared secret, NUL-padded"}

  relay_hdr:
    doc: "Every message (request and response) begins with this header."
    size: 8
    fields:
      - {name: magic,   type: u8, array: 2, doc: "'M','T'"}
      - {name: version, type: u8,           doc: "PROTO_VERSION"}
      - {name: cmd,     type: u8,           doc: "enum relay_cmd"}
      - {name: station, type: u16,          doc: "from tournament.cfg"}
      - {name: len,     type: u16,          doc: "payload bytes following the header"}

  relay_resp:
    doc: >-
      Every response: relay_hdr (same cmd), then this, then an optional
      command-specific payload (see messages).
    size: 32
    fields:
      - {name: status, type: u8, doc: "enum relay_status"}
      - {name: _pad,   type: u8}
      - {name: msg,    type: char, array: MSG_LEN, doc: "short human text for the menu"}

  set_entry:
    doc: "One selectable set in a LIST_SETS response. The relay sends them earliest round first, so equal round names are adjacent (the menu groups them under one header)."
    size: 72
    fields:
      - {name: set_id,        type: u32}
      - {name: p1_entrant_id, type: u32}
      - {name: p2_entrant_id, type: u32}
      - {name: round,         type: char, array: ROUND_LEN, doc: "\"WINNERS QUARTER-FINAL\", \"LOSERS ROUND 1\""}
      - {name: p1_tag,        type: char, array: TAG_LEN}
      - {name: p2_tag,        type: char, array: TAG_LEN}
      - {name: best_of,       type: u8,   doc: "3 or 5"}
      - {name: state,         type: u8,   doc: "0 = pending, 1 = in progress (this station)"}
      - {name: _pad,          type: u8, array: 2}

  list_sets_resp:
    doc: "CMD_LIST_SETS response payload. count set_entry rows follow the fixed part."
    size: 4          # fixed part only; sets[] follows
    fields:
      - {name: count, type: u16, doc: "number of sets following"}
      - {name: _pad,  type: u16}
      - {name: sets,  type: set_entry, array: count, max: MAX_SETS}

  start_set_req:
    doc: "CMD_START_SET request payload."
    size: 8
    fields:
      - {name: set_id, type: u32}
      - {name: stream, type: u8, doc: "from tournament.cfg"}
      - {name: _pad,   type: u8, array: 3}

  game_result:
    doc: "One completed game."
    size: 4
    fields:
      - {name: winner_slot, type: u8, doc: "1 or 2"}
      - {name: p1_char,     type: u8, doc: "Melee external character id (CharacterKind, the CSS ckind value: 0 = Captain Falcon .. 25 = Ganondorf) of entrant 1; 0xFF = unknown (a game scored by hand). Anything the relay cannot map is omitted, never rejected."}
      - {name: p2_char,     type: u8}
      - {name: stage,       type: u8, doc: "Melee internal stage id (StKind, e.g. 0x1F Battlefield, 0x20 Final Destination); 0 = unknown, e.g. a game scored by hand"}

  report_score_req:
    doc: >-
      CMD_REPORT_SCORE request payload. Always the full game list;
      the relay does a full overwrite (idempotent).
    size: 28
    fields:
      - {name: set_id,     type: u32}
      - {name: game_count, type: u8, doc: "0-5 valid entries in games"}
      - {name: _pad,       type: u8, array: 3}
      - {name: games,      type: game_result, array: MAX_GAMES}

  end_set_req:
    doc: "CMD_END_SET request payload. Relay derives the winner from the game list."
    size: 28
    fields:
      - {name: set_id,     type: u32}
      - {name: game_count, type: u8}
      - {name: _pad,       type: u8, array: 3}
      - {name: games,      type: game_result, array: MAX_GAMES}

  abandon_set_req:
    doc: "CMD_ABANDON_SET request payload. Only valid if the set has no reported games."
    size: 4
    fields:
      - {name: set_id, type: u32}

# Which struct follows relay_hdr in a request, and which struct (if any)
# follows relay_resp in an ST_OK response.
messages:
  CMD_LIST_SETS:    {request: null,             response_payload: list_sets_resp}
  CMD_START_SET:    {request: start_set_req,    response_payload: null}
  CMD_REPORT_SCORE: {request: report_score_req, response_payload: null}
  CMD_END_SET:      {request: end_set_req,      response_payload: null}
  CMD_ABANDON_SET:  {request: abandon_set_req,  response_payload: null}
