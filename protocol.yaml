# protocol.yaml — single source of truth for the Wii <-> relay wire protocol.
#
# This file is architecture.md in machine-readable form. Everything on the
# wire is defined here and nowhere else. Generated outputs (do not edit them):
#
#   generated/wire.ts                 encode/decode module for the relay
#   kiosk/include/relay_proto.h       C header for the kiosk module
#   Nintendont/kernel/relay_proto.h   the same header for the Nintendont kernel
#
# Regenerate:  python tools/gen_protocol.py
# Verify:      python tools/check_protocol.py   (CI fails on drift)
#
# Layout rules enforced by the generator:
#   - All integers big-endian on the wire (PowerPC sends structs as-is).
#   - All strings ASCII, NUL-padded, not NUL-terminated if full.
#   - Every field must fall on its natural alignment with no implicit
#     padding; padding is always an explicit _pad field.
#   - Each struct declares its expected size; the generator errors if the
#     computed layout disagrees.

protocol:
  version: 1
  magic: "MT"          # first two bytes of every message
  endian: big

constants:
  MAX_GAMES:
    value: 5
    doc: "games per set (best of 5)"
  MAX_SETS:
    value: 56
    doc: "cap on set_entry rows in a LIST_SETS response; 56 is the most that fits the game's 4 KB poll buffer (4096 - 12 exi_poll_hdr - 8 hdr - 32 resp - 4 fixed = 4040 bytes = 56 rows of 72)"
  MSG_LEN:
    value: 30
    doc: "human-readable status text in relay_resp"
  ROUND_LEN:
    value: 24
    doc: "round name as the players see it, upper case: \"WINNERS QUARTER-FINAL\", \"LOSERS ROUND 1\", \"GRAND FINAL RESET\" (start.gg fullRoundText, cut to fit)"
  TAG_LEN:
    value: 16
    doc: "player tag"
  BEACON_PORT:
    value: 29471
    doc: "UDP port the relay broadcasts relay_beacon to and every station listens on (decisions.md R15: stations find the relay; lazyto_station.txt has no relay address)"
  BEACON_INTERVAL_MS:
    value: 2000
    doc: "the relay sends one relay_beacon per interval on every IPv4 interface"
  SECRET_LEN:
    value: 16
    doc: "relay shared secret, printable ASCII, NUL-padded (decisions.md R16)"
  AUTH_MAGIC_0:
    value: 0x4D
    doc: "'M', first byte of relay_auth"
  AUTH_MAGIC_1:
    value: 0x4B
    doc: "'K', second byte of relay_auth; differs from relay_hdr's 'T' so a host that sends no relay_auth is told so"
  TELEMETRY_PORT:
    value: 29472
    doc: "UDP port on the relay that stations send telemetry datagrams to (kernel log lines and the module's load status), at the address the beacon came from"
  TELEMETRY_MAGIC_1:
    value: 0x4C
    doc: "'L', second byte of telemetry_hdr ('M','L')"
  TELEMETRY_TEXT_MAX:
    value: 480
    doc: "most log text bytes in one TM_LOG datagram; keeps relay_auth + telemetry_hdr + text well under one Ethernet frame"
  TELEMETRY_STATUS_MS:
    value: 5000
    doc: "a station sends a TM_STATUS datagram at least this often once it knows the relay"
  CRASH_MAILBOX_PPC:
    value: 0xD3003480
    doc: "PPC uncached MEM2 address of the crash_mailbox the game's module writes from its OS error handler; the Nintendont kernel reads it at 0x13003480 (same bytes) and sends a TM_CRASH when seq changes. Between HID_STATUS (0x13003440..0x1300344C) and slippi_settings (0x13003500). Not used by Dolphin."
  CRASH_MAGIC:
    value: 0x4D544352
    doc: "'MTCR', first word of crash_mailbox"
  CRASH_STACK_DEPTH:
    value: 8
    doc: "LR saves walked up the crashed stack in crash_report"

enums:
  relay_cmd:
    doc: "request/response command, echoed back in the response header"
    values:
      CMD_LIST_SETS:    {value: 1}
      CMD_START_SET:    {value: 2}
      CMD_REPORT_SCORE: {value: 3}
      CMD_END_SET:      {value: 4}
      CMD_ABANDON_SET:  {value: 5, doc: "player-initiated \"wrong set\"; relay resets it"}

  relay_status:
    doc: "result of a request, first byte of relay_resp"
    values:
      ST_OK:            {value: 0}
      ST_BAD_VERSION:   {value: 1}
      ST_SET_NOT_FOUND: {value: 2}
      ST_SET_TAKEN:     {value: 3, doc: "started on another station"}
      ST_NOT_STREAM:    {value: 4, doc: "no longer sent: the relay picks the stream station itself"}
      ST_STARTGG_ERROR: {value: 5, doc: "upstream rejected; see status page"}
      ST_RATE_LIMITED:  {value: 6}
      ST_INTERNAL:      {value: 7}
      ST_BAD_SECRET:    {value: 8, doc: "relay_auth missing or its secret wrong; check secret= on the SD card (decisions.md R16)"}

  exi_cmd:
    doc: >-
      Command byte on the fake relay EXI device. Shared by the game side
      (lbrelayexi.c), Slippi Dolphin's forwarder, and Nintendont's RelayEXI;
      not part of the TCP wire format. Values chosen clear of Slippi's
      EXI command space, which extends to 0xE5 (CMD_GET_RANK_VISIBILITY
      in EXI_DeviceSlippi.h).
    values:
      EXI_RELAY_REQ:  {value: 0xF0, doc: "write request buffer to the ARM side"}
      EXI_RELAY_POLL: {value: 0xF1, doc: "read {state, response buffer}"}

  exi_poll_flags:
    doc: "bit flags in exi_poll_hdr.flags; set by the host when it already knows a request cannot go out (Nintendont kernel: NetworkStarted, lazyto_station.txt)"
    values:
      PF_NO_NETWORK:  {value: 1, doc: "the host will never have a network: the loader's Network option is off"}
      PF_NO_CFG:      {value: 2, doc: "no usable sd:/lazyto_station.txt"}
      PF_NO_SECRET:   {value: 4, doc: "lazyto_station.txt has no valid secret="}
      PF_NET_JOINING: {value: 8, doc: "Network is on but the Wi-Fi join / DHCP has not finished yet; the kernel brings the network up on its own thread (IOS SO_STARTUP blocks with no timeout) so the game boots meanwhile; clears on its own, the kiosk waits on it"}

  exi_host_opts:
    doc: "bit flags in exi_poll_hdr.host_opts: what the host's settings ask the kiosk to do with Melee's audio (the kiosk forces mono and music off unless told otherwise)"
    values:
      HO_MUSIC_ON: {value: 1, doc: "leave Melee's music on (sound balance untouched)"}
      HO_STEREO:   {value: 2, doc: "leave Melee in stereo (no OSSetSoundMode(mono))"}

  exi_poll_state:
    doc: "state byte of exi_poll_hdr, the first thing an EXI_RELAY_POLL read returns"
    values:
      RELAY_IDLE:  {value: 0}
      RELAY_BUSY:  {value: 1, doc: "request in flight on the ARM side"}
      RELAY_DONE:  {value: 2, doc: "response buffer valid"}
      RELAY_ERROR: {value: 3, doc: "transport failed; response buffer is zeroed"}

  telemetry_kind:
    doc: "what follows a telemetry_hdr"
    values:
      TM_LOG:    {value: 1, doc: "len bytes of kernel log text, ASCII, lines ending in \\n (a line may be split across datagrams)"}
      TM_STATUS: {value: 2, doc: "one station_status"}
      TM_CRASH:  {value: 3, doc: "one crash_report: the game took an unhandled exception"}

  module_state:
    doc: "what the host did with sd:/lazyto_kiosk.bin at game boot (Nintendont kernel LoadTournamentModule)"
    values:
      MOD_PENDING:     {value: 0, doc: "no game booted yet"}
      MOD_LOADED:      {value: 1}
      MOD_NOT_FOUND:   {value: 2, doc: "no sd:/lazyto_kiosk.bin"}
      MOD_BAD_FILE:    {value: 3, doc: "not a TMOD file"}
      MOD_BAD_HEADER:  {value: 4, doc: "unsupported version, size or load address"}
      MOD_GUARD:       {value: 5, doc: "guard word mismatch: the disc is not stock Melee 1.02"}
      MOD_ARENA:       {value: 6, doc: "the module would overlap game memory (arena top below the module)"}
      MOD_READ_FAILED: {value: 7}
      MOD_NOT_MELEE:   {value: 8, doc: "the booted game is not Melee NTSC 1.02"}

structs:
  exi_poll_hdr:
    doc: >-
      What an EXI_RELAY_POLL read starts with (the game's lbRelayExi_PollBuf:
      this, then relay_hdr, relay_resp and the payload). Not on the TCP wire:
      filled by the host of the fake EXI device (Nintendont kernel, Slippi
      Dolphin) on every poll, so the game can show which station it is and
      which relay it is talking to even while the relay never answers. The
      response bytes after it are valid only when state == RELAY_DONE.
    size: 12
    fields:
      - {name: state,      type: u8,  doc: "enum exi_poll_state"}
      - {name: flags,      type: u8,  doc: "exi_poll_flags bits: why the relay cannot be reached yet, so the kiosk can say so instead of waiting for a beacon; 0 = nothing wrong (the Dolphin forwarder leaves it 0)"}
      - {name: station,    type: u16, doc: "lazyto_station.txt station; 0 in Dolphin (decisions.md R10)"}
      - {name: relay_ip,   type: u32, doc: "relay IPv4 address as a big-endian u32 (10.0.0.2 = 0x0A000002); 0 = unknown"}
      - {name: relay_port, type: u16, doc: "relay TCP port; 0 = unknown"}
      - {name: host_opts,  type: u8,  doc: "exi_host_opts bits: venue audio choices from the host's settings (Nintendont loader menu); 0 = the kiosk defaults, mono and music off (Dolphin)"}
      - {name: host_build, type: u8,  doc: "the host's build number for the set list's version text (Nintendont NIN_HOST_BUILD, bumped by hand per loader release); 0 = unknown (Dolphin)"}

  relay_beacon:
    doc: >-
      Relay discovery (decisions.md R15). Not on the TCP wire: one UDP datagram,
      broadcast by the relay every BEACON_INTERVAL_MS to each IPv4
      interface's directed broadcast address, port BEACON_PORT. A station
      (Nintendont kernel, Slippi Dolphin forwarder) listens on BEACON_PORT,
      ignores datagrams whose size, magic or version do not match, and
      takes the datagram's SOURCE address plus tcp_port as the relay; the
      latest valid beacon wins, so a relay that changes address is followed.
      One relay per LAN. BEACON REQUEST (2026-09-30): some access points do
      not deliver broadcasts to a power-saving Wi-Fi client, so a station that
      has heard nothing may broadcast this same struct with tcp_port = 0 and
      event_id = 0 to TELEMETRY_PORT; the relay answers with a unicast
      relay_beacon to the sender's address at BEACON_PORT.
    size: 12
    fields:
      - {name: magic,    type: u8, array: 2, doc: "'M','T'"}
      - {name: version,  type: u8,           doc: "PROTO_VERSION"}
      - {name: _pad,     type: u8}
      - {name: tcp_port, type: u16,          doc: "the relay's TCP port for relay_hdr requests"}
      - {name: _pad2,    type: u16}
      - {name: event_id, type: u32,          doc: "start.gg event the relay serves; for logs and display only"}

  relay_auth:
    doc: >-
      Relay shared secret (decisions.md R16). Not part of the game's messages: the
      host of the fake EXI device (Nintendont kernel, Slippi Dolphin
      forwarder) writes it on the TCP connection before the game's relay_hdr
      + payload, with the secret from its own config (lazyto_station.txt secret=,
      Dolphin SlippiRelaySecret). The relay compares the secret with its
      config in constant time and answers a missing or wrong one with
      ST_BAD_SECRET without acting on the request. Responses carry no
      relay_auth. Plaintext on the LAN: it keeps passers-by on a shared Wi-Fi
      out, not someone capturing the Wi-Fi traffic.
    size: 20
    fields:
      - {name: magic,  type: u8,   array: 2, doc: "AUTH_MAGIC_0, AUTH_MAGIC_1 ('M','K')"}
      - {name: _pad,   type: u16}
      - {name: secret, type: char, array: SECRET_LEN, doc: "the shared secret, NUL-padded"}

  telemetry_hdr:
    doc: >-
      Station telemetry. Not part of the game's messages: the host of the
      fake EXI device (Nintendont kernel) sends one UDP datagram per message
      to the relay's address from the beacon, port TELEMETRY_PORT:
      relay_auth (the same shared secret as TCP requests), this header, then
      len payload bytes (TM_LOG text or one station_status). The relay drops
      datagrams with a wrong secret (counted on the status page), keeps the
      last log lines and status per station, and never answers. seq counts
      datagrams from 0 at kernel boot, so a gap is a lost datagram and a
      smaller seq is a reboot.
    size: 16
    fields:
      - {name: magic,     type: u8,  array: 2, doc: "MAGIC_0, TELEMETRY_MAGIC_1 ('M','L')"}
      - {name: version,   type: u8,            doc: "PROTO_VERSION"}
      - {name: kind,      type: u8,            doc: "enum telemetry_kind"}
      - {name: station,   type: u16,           doc: "lazyto_station.txt station"}
      - {name: len,       type: u16,           doc: "payload bytes after this header"}
      - {name: seq,       type: u32}
      - {name: uptime_ms, type: u32,           doc: "milliseconds since the kernel started"}

  station_status:
    doc: "TM_STATUS payload: what the station's host knows about its own boot."
    size: 20
    fields:
      - {name: module_state,   type: u8,  doc: "enum module_state"}
      - {name: _pad,           type: u8}
      - {name: module_patches, type: u16, doc: "hook patches applied (MOD_LOADED)"}
      - {name: module_len,     type: u32, doc: "module code bytes (MOD_LOADED)"}
      - {name: module_load,    type: u32, doc: "module load address (MOD_LOADED)"}
      - {name: arena_hi,       type: u32, doc: "the boot-info arena top (0x80000034) the host saw at load time; 0 = unset, the game then uses its built-in default"}
      - {name: log_dropped,    type: u32, doc: "log bytes discarded because the host's buffer was full"}

  crash_report:
    doc: >-
      What the game's module records in its OS error handler (lbcrash.c,
      installed with OSSetErrorHandler ahead of Melee's own crash screen,
      which still appears): the exception, the faulting address and the
      instruction words the PPC READS there through its data cache, the
      registers that matter and a short walk of the stack's LR saves. The
      Nintendont kernel forwards it as TM_CRASH; the relay shows it and the
      addresses are resolved offline against the module map and the
      vanilla symbol map (melee tools/resolve_crash.py).
    size: 84
    fields:
      - {name: error,     type: u8,  doc: "OSError number: 2 DSI, 3 ISI, 5 alignment, 6 program (illegal instruction), 7 floating point"}
      - {name: _pad,      type: u8}
      - {name: count,     type: u16, doc: "crashes recorded since boot (normally 1)"}
      - {name: srr0,      type: u32, doc: "faulting address"}
      - {name: srr1,      type: u32, doc: "MSR at the fault; for a program exception bit 0x80000 = illegal, 0x40000 = privileged, 0x20000 = trap"}
      - {name: dsisr,     type: u32}
      - {name: dar,       type: u32, doc: "data address for DSI / alignment"}
      - {name: lr,        type: u32}
      - {name: sp,        type: u32, doc: "r1"}
      - {name: r3,        type: u32}
      - {name: r4,        type: u32}
      - {name: fetched,   type: u32, array: 4, doc: "the four words at srr0 as the PPC reads them (0 when srr0 is not a readable MEM1 address): compared with the module file they tell stale cache from overwritten memory"}
      - {name: stack,     type: u32, array: CRASH_STACK_DEPTH, doc: "LR saves from the stack frames above sp, 0-filled"}

  crash_mailbox:
    doc: >-
      Not on the wire: the shared-memory slot at CRASH_MAILBOX_PPC. The
      module writes report then seq (seq last, so a reader that sees a new
      seq sees a complete report); the kernel polls seq.
    size: 92
    fields:
      - {name: magic,  type: u32, doc: "CRASH_MAGIC"}
      - {name: seq,    type: u32, doc: "0 = nothing recorded; incremented per crash"}
      - {name: report, type: crash_report}

  relay_hdr:
    doc: "Every message (request and response) begins with this header."
    size: 8
    fields:
      - {name: magic,   type: u8, array: 2, doc: "'M','T'"}
      - {name: version, type: u8,           doc: "PROTO_VERSION"}
      - {name: cmd,     type: u8,           doc: "enum relay_cmd"}
      - {name: station, type: u16,          doc: "from lazyto_station.txt"}
      - {name: len,     type: u16,          doc: "payload bytes following the header"}

  relay_resp:
    doc: >-
      Every response: relay_hdr (same cmd), then this, then an optional
      command-specific payload (see messages).
    size: 32
    fields:
      - {name: status, type: u8, doc: "enum relay_status"}
      - {name: _pad,   type: u8}
      - {name: msg,    type: char, array: MSG_LEN, doc: "short human text for the menu"}

  set_entry:
    doc: "One selectable set in a LIST_SETS response. The relay sends them earliest round first, so equal round names are adjacent (the menu groups them under one header)."
    size: 72
    fields:
      - {name: set_id,        type: u32}
      - {name: p1_entrant_id, type: u32}
      - {name: p2_entrant_id, type: u32}
      - {name: round,         type: char, array: ROUND_LEN, doc: "\"WINNERS QUARTER-FINAL\", \"LOSERS ROUND 1\""}
      - {name: p1_tag,        type: char, array: TAG_LEN}
      - {name: p2_tag,        type: char, array: TAG_LEN}
      - {name: best_of,       type: u8,   doc: "3 or 5"}
      - {name: state,         type: u8,   doc: "0 = pending, 1 = in progress (this station)"}
      - {name: _pad,          type: u8, array: 2}

  list_sets_resp:
    doc: "CMD_LIST_SETS response payload. count set_entry rows follow the fixed part."
    size: 4          # fixed part only; sets[] follows
    fields:
      - {name: count, type: u16, doc: "number of sets following"}
      - {name: _pad,  type: u16}
      - {name: sets,  type: set_entry, array: count, max: MAX_SETS}

  start_set_req:
    doc: "CMD_START_SET request payload."
    size: 8
    fields:
      - {name: set_id, type: u32}
      - {name: stream, type: u8, doc: "unused: the game sends 0 and the relay ignores it (the stream station is set on the relay)"}
      - {name: _pad,   type: u8, array: 3}

  game_result:
    doc: >-
      One completed game. The stock and costume fields (2026-09-30) feed
      start.gg's per-game entrant scores the way Replay Reporter for Slippi
      does: score = (costume + 1) * 100 + stocks remaining, so the set page
      shows the colour and the stock icons; both 0xFF = unknown (a game scored
      by hand), and the relay then sends no score for that game.
    size: 8
    fields:
      - {name: winner_slot, type: u8, doc: "1 or 2"}
      - {name: p1_char,     type: u8, doc: "Melee external character id (CharacterKind, the CSS ckind value: 0 = Captain Falcon .. 25 = Ganondorf) of entrant 1; 0xFF = unknown (a game scored by hand). Anything the relay cannot map is omitted, never rejected."}
      - {name: p2_char,     type: u8}
      - {name: stage,       type: u8, doc: "Melee internal stage id (StKind, e.g. 0x1F Battlefield, 0x20 Final Destination); 0 = unknown, e.g. a game scored by hand"}
      - {name: p1_stocks,   type: u8, doc: "entrant 1's stocks remaining at the end of the game (0 for the player who was KO'd); 0xFF = unknown"}
      - {name: p2_stocks,   type: u8}
      - {name: p1_costume,  type: u8, doc: "entrant 1's costume (colour) index, 0 = the default colour; 0xFF = unknown"}
      - {name: p2_costume,  type: u8}

  report_score_req:
    doc: >-
      CMD_REPORT_SCORE request payload. Always the full game list;
      the relay does a full overwrite (idempotent).
    size: 48
    fields:
      - {name: set_id,     type: u32}
      - {name: game_count, type: u8, doc: "0-5 valid entries in games"}
      - {name: _pad,       type: u8, array: 3}
      - {name: games,      type: game_result, array: MAX_GAMES}

  end_set_req:
    doc: "CMD_END_SET request payload. Relay derives the winner from the game list."
    size: 48
    fields:
      - {name: set_id,     type: u32}
      - {name: game_count, type: u8}
      - {name: _pad,       type: u8, array: 3}
      - {name: games,      type: game_result, array: MAX_GAMES}

  abandon_set_req:
    doc: "CMD_ABANDON_SET request payload. Only valid if the set has no reported games."
    size: 4
    fields:
      - {name: set_id, type: u32}

# Which struct follows relay_hdr in a request, and which struct (if any)
# follows relay_resp in an ST_OK response.
messages:
  CMD_LIST_SETS:    {request: null,             response_payload: list_sets_resp}
  CMD_START_SET:    {request: start_set_req,    response_payload: null}
  CMD_REPORT_SCORE: {request: report_score_req, response_payload: null}
  CMD_END_SET:      {request: end_set_req,      response_payload: null}
  CMD_ABANDON_SET:  {request: abandon_set_req,  response_payload: null}
